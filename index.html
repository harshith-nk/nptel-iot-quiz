<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>NPTEL IIoT — 180 Question Mega Quiz</title>
<style>
:root{color-scheme:light;--ink:#182230;--muted:#667085;--line:#d9e0e8;--bg:#f4f7fb;--card:#fff;--accent:#155eef;--accent-soft:#eff6ff;--accent-line:#84adff;--green:#067647;--green-bg:#ecfdf3;--green-line:#32a879;--red:#b42318;--red-bg:#fef3f2;--red-line:#fda29b;--amber:#b54708;--amber-bg:#fffaeb;--amber-line:#f79009;--chip:#e7eef8;--chipink:#183b63;--head:#102a43;--headink:#d8e6f3}
[data-theme=dark]{color-scheme:dark;--ink:#e6edf5;--muted:#9aa8b8;--line:#2b3a4b;--bg:#0e1621;--card:#16212e;--accent:#3b82f6;--accent-soft:#17263d;--accent-line:#3b6fd1;--green:#4ade80;--green-bg:#10281c;--green-line:#1f8a55;--red:#ff8a80;--red-bg:#2d1618;--red-line:#8a3a36;--amber:#fbbf24;--amber-bg:#2b2310;--amber-line:#b7791f;--chip:#22324a;--chipink:#cfe0f5;--head:#0a1a2a;--headink:#aebfd1}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.top{background:var(--head);color:#fff;padding:22px 18px}.wrap{max-width:920px;margin:auto}
.toprow{display:flex;gap:12px;align-items:flex-start}.toprow>div{flex:1}
.top h1{font-size:clamp(1.3rem,4vw,1.9rem);line-height:1.2;margin:0 0 6px}.top p{margin:0;color:var(--headink);font-size:14px}
.themebtn{background:#ffffff1f;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer;font-size:15px}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer;font-size:15px;font-family:inherit}
.primary{background:var(--accent);color:#fff}.secondary{background:var(--chip);color:var(--chipink)}.danger{background:var(--red);color:#fff}[data-theme=dark] .danger{color:#1a0a0a}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.mini{padding:5px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 2px 4px #172b4d08}
.card h2{margin:0 0 12px;font-size:1.15rem}.card h3{margin:0 0 8px;font-size:1rem}
main,.setupmain{padding:16px 12px 60px}
.field{margin:0 0 14px}.field>label,.lbl{display:block;font-weight:700;font-size:14px;margin:0 0 6px}
select{width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.wk{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:14px;font-weight:650;user-select:none}
.wk:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}.wk input{accent-color:var(--accent);margin:0}
.radios{display:flex;gap:8px;flex-wrap:wrap}.radios label{flex:1;min-width:200px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.radios label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line)}.radios input{accent-color:var(--accent);margin-right:6px}
.radios small{display:block;color:var(--muted);font-weight:400;margin-left:22px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 14px;font-size:14px}.checks input{accent-color:var(--accent);margin-right:6px}
.small{font-size:13px;color:var(--muted)}.pool{font-weight:700;margin:0 0 12px}
.okline{color:var(--green);font-weight:650}.warnline{color:var(--red);font-weight:700}
.resume{border-color:var(--accent-line);background:var(--accent-soft)}.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:650}
.toolbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:9px 12px;opacity:.99}
.toolinner{max-width:920px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.counter{font-weight:700;white-space:nowrap;font-size:14px}.timer{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}.timer.warn{color:var(--red)}
.bar{height:8px;background:var(--line);border-radius:99px;flex:1;min-width:70px;overflow:hidden}.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:0 0 14px;box-shadow:0 2px 4px #172b4d08;scroll-margin-top:90px}
.qcard.missing{border-color:var(--amber-line);box-shadow:0 0 0 3px var(--amber-bg),0 0 0 4px var(--amber-line)}
.qcard.flash{animation:flash 1.6s}@keyframes flash{0%,60%{box-shadow:0 0 0 4px var(--amber-line)}100%{box-shadow:0 2px 4px #172b4d08}}
.qhead{display:flex;gap:10px;align-items:flex-start}.qnum{background:var(--accent-soft);color:var(--accent);border-radius:8px;min-width:42px;text-align:center;padding:5px 7px;font-weight:800;font-size:14px}
.question{font-weight:700;margin:3px 0 14px;white-space:pre-wrap}.week{font-size:12px;color:var(--muted);font-weight:650;margin-left:auto;white-space:nowrap}
.options{display:grid;gap:8px}.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;transition:border .12s,background .12s}
.opt:hover{border-color:var(--accent-line)}.opt input{margin-top:5px;accent-color:var(--accent);flex-shrink:0}.opt.locked{cursor:default}.letter{font-weight:750;min-width:18px}.opttext{white-space:pre-wrap}
.opt.selected{border-color:var(--accent-line);background:var(--accent-soft)}.opt.correct{border-color:var(--green-line);background:var(--green-bg)}.opt.wrong{border-color:var(--red-line);background:var(--red-bg)}
.feedback{font-size:14px;margin-top:12px;font-weight:650}.feedback:empty{display:none}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.feedback.skip{color:var(--amber)}
.qfoot{display:flex;gap:8px;margin-top:10px}.linkbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:13px;cursor:pointer;font-family:inherit}
.linkbtn.on{border-color:var(--amber-line);color:var(--amber);background:var(--amber-bg);font-weight:700}.linkbtn:disabled{opacity:.4;cursor:default}
.result{margin:0 0 16px;padding:20px;border-radius:14px;background:var(--card);border:1px solid var(--line)}.result h2{margin:0 0 4px}.score{font-size:2.2rem;font-weight:850;color:var(--accent)}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin:8px 0 12px;font-size:14px}.stats b{font-size:1.1rem}
.verify{padding:10px 12px;border-radius:10px;background:var(--green-bg);border:1px solid var(--green-line);color:var(--green);font-size:14px;margin:12px 0}.verify.bad{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.wkbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:80px}.wkbar span{display:block;height:100%;background:var(--green-line)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 4px}.filters .btn{padding:6px 12px;font-size:13px}.filters .btn.on{background:var(--accent);color:#fff}
#quiz.f-wrong .qcard:not([data-res=wrong]),#quiz.f-skipped .qcard:not([data-res=skipped]),#quiz.f-correct .qcard:not([data-res=correct]),#quiz.f-flag .qcard:not(.flagged){display:none}
.endbar{text-align:center;padding:10px 0 30px}.endbar .btn{padding:14px 28px;font-size:16px}
.modalback{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--line)}
.modal h3{margin:0;padding:16px 18px 6px;font-size:1.1rem}.mbody{padding:6px 18px;overflow:auto}.mact{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:0 0 10px}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px;border:1px solid var(--line)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.mchip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 0;font-size:13px;font-weight:700;cursor:pointer;position:relative;font-family:inherit}
.mchip.a{background:var(--accent);border-color:var(--accent);color:#fff}.mchip.u{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.mchip.ok{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}.mchip.no{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}.mchip.sk{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.mchip.f::after{content:"⚑";position:absolute;top:-7px;right:-3px;font-size:11px;color:var(--amber)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:90%;text-align:center;backdrop-filter:blur(6px)}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.qcard{padding:14px}.week{font-size:11px}.toolinner{gap:6px}.btn{padding:9px 11px;font-size:14px}.toolbar .btn{padding:7px 10px;font-size:13px}}
</style></head><body>
<header class="top"><div class="wrap toprow"><div><h1>NPTEL IIoT — 180 Question Mega Quiz</h1><p>Weeks 1–12 · 180 assignment questions · practice or exam mode · progress saved on this device</p></div><button class="themebtn" id="themeBtn" aria-label="Toggle dark mode">🌙</button></div></header>

<div id="setupView"><div class="wrap setupmain">
  <div id="resumeBox"></div>
  <div class="card"><h2>Start a quiz</h2>
    <div class="field"><span class="lbl">Weeks</span><div class="chips" id="weekChips"></div><div class="rowbtns"><button class="btn secondary mini" id="wkAll">Select all</button><button class="btn secondary mini" id="wkNone">Clear</button></div></div>
    <div class="grid2">
      <div class="field"><label for="selSource">Questions from</label><select id="selSource"><option value="all">All questions in selected weeks</option><option value="mistakes" id="optMistakes">My previous mistakes</option></select></div>
      <div class="field"><label for="selCount">How many questions</label><select id="selCount"><option value="0">All available</option><option value="10">10</option><option value="25">25</option><option value="50">50</option><option value="90">90</option><option value="100">100</option></select></div>
    </div>
    <div class="field"><span class="lbl">Mode</span><div class="radios">
      <label><input type="radio" name="mode" value="exam" checked>Exam mode<small>Answers hidden until you submit. You can change answers.</small></label>
      <label><input type="radio" name="mode" value="practice">Practice mode<small>Instant right/wrong after each answer (answer then locks).</small></label></div></div>
    <div class="grid2"><div class="field"><label for="selLimit">Time limit</label><select id="selLimit"><option value="0">No limit (just a timer)</option><option value="30">30 minutes</option><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option><option value="180">180 minutes</option></select></div><div></div></div>
    <div class="checks"><label><input type="checkbox" id="cbShufQ" checked>Shuffle questions</label><label><input type="checkbox" id="cbShufO" checked>Shuffle options</label></div>
    <div class="pool" id="poolInfo"></div>
    <button class="btn primary" id="startBtn">Start quiz</button>
  </div>
  <div class="card" id="auditCard"></div>
  <div class="card" id="histCard"></div>
</div></div>

<div id="quizView" hidden>
  <div class="toolbar"><div class="toolinner">
    <button class="btn secondary" id="btnMenu" title="Back to menu (progress is saved)">☰ Menu</button>
    <div class="counter" id="counter"></div><div class="bar"><span id="progress"></span></div><div class="timer" id="timer"></div>
    <button class="btn secondary" id="btnMap">🗺 Map</button><button class="btn secondary" id="btnNext">Find unanswered</button><button class="btn primary" id="btnSubmit">Submit</button>
  </div></div>
  <main class="wrap"><section class="result" id="result" hidden aria-live="polite"></section><div id="quiz"></div><div class="endbar" id="endbar"><button class="btn primary" id="btnSubmit2">Submit quiz</button></div></main>
</div>

<div class="modalback" id="modal" hidden><div class="modal" role="dialog" aria-modal="true"><h3 id="mTitle"></h3><div class="mbody" id="mBody"></div><div class="mact" id="mActions"></div></div></div>
<div class="toast" id="toast" hidden></div>

asily available but very expensive"},{"label":"D","text":"Non-recyclable and heavy"}],"answer":"B"},{"week":2,"num":2,"q":"Which of the following is NOT a characteristic of the Fourth Industrial Revolution?","options":[{"label":"A","text":"Extensive use of the ubiquitous and mobile internet"},{"label":"B","text":"Use of artificial intelligence and machine learning"},{"label":"C","text":"Invention of the steam engine"},{"label":"D","text":"Development of Cyber Physical Systems (CPS)"}],"answer":"C"},{"week":2,"num":3,"q":"What is considered the main nervous system of any manufacturing industry?","options":[{"label":"A","text":"Human Resources"},{"label":"B","text":"Information and Communication Technology (ICT)"},{"label":"C","text":"Supply Chain Management (SCM)"},{"label":"D","text":"Marketing"}],"answer":"B"},{"week":2,"num":4,"q":"Which of the following is not a characteristic of a sustainable industry?","options":[{"label":"A","text":"Energy efficiency"},{"label":"B","text":"Reliance on government subsidy"},{"label":"C","text":"Conservation of resource"},{"label":"D","text":"Low-waste production"}],"answer":"B"},{"week":2,"num":5,"q":"What does L, D and T stand for under ‘People Engagement’ in the Lean production System?","options":[{"label":"A","text":"Learn, Do, Teach"},{"label":"B","text":"Leverage, Divulge, Teardown"},{"label":"C","text":"Lean, Diverse, Timid"},{"label":"D","text":"Loan, Deploy, Test"}],"answer":"A"},{"week":2,"num":6,"q":"Which resource is associated with the 'Optimization' categorization of Smart and connected products?","options":[{"label":"A","text":"Optimization algorithms"},{"label":"B","text":"Manual controls"},{"label":"C","text":"Marketing data"},{"label":"D","text":"Financial reports"}],"answer":"A"},{"week":2,"num":7,"q":"State True or False. The amalgamation of CPS and the evolution of Internet-based technologies led to the development of the Industrial Internet.","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"A"},{"week":2,"num":8,"q":"State True or False. Real-time supply chain monitoring reduces inventory and capital requirements.","options":[{"label":"A","text":"True"},{"label":"B","text":"False"}],"answer":"A"},{"week":2,"num":9,"q":"In the context of Industry 4.0, what is the full form of CPS?","options":[{"label":"A","text":"Controlled Power System"},{"label":"B","text":"Customer Provisioning Service"},{"label":"C","text":"Cloud Processing Service"},{"label":"D","text":"Cyber Physical Systems"}],"answer":"D"},{"week":2,"num":10,"q":"What does ERP stand for in the context of ICT?","options":[{"label":"A","text":"Enterprise Resource Planning"},{"label":"B","text":"Electronic Resource Platform"},{"label":"C","text":"Enhanced Reporting Protocol"},{"label":"D","text":"Economic Resource Planning"}],"answer":"A"},{"week":2,"num":11,"q":"What is a 'value stream' in Lean Production System?.","options":[{"label":"A","text":"A set of tools for production"},{"label":"B","text":"All the actions required for a product from order to delivery"},{"label":"C","text":"A method of employee training"},{"label":"D","text":"A type of waste reduction"}],"answer":"B"},{"week":2,"num":12,"q":"Which of the following are key attributes of a smart business model?","options":[{"label":"A","text":"Manual processes, cost reduction, and labor dependency"},{"label":"B","text":"Value proposition, revenue streams, and technologies"},{"label":"C","text":"Traditional marketing, fixed costs, and limited innovation"},{"label":"D","text":"Centralized control, non-digital strategies, and fixed processes"}],"answer":"B"},{"week":2,"num":13,"q":"Which of the following is not a component of a Smart Factory?","options":[{"label":"A","text":"Smart machines"},{"label":"B","text":"Smart manufacturing processes"},{"label":"C","text":"Information Technology"},{"label":"D","text":"Physical ledgers"}],"answer":"D"},{"week":2,"num":14,"q":"In which format is healthcare data transmitted to maintain data uniformity and interoperability?","options":[{"label":"A","text":"HL-7"},{"label":"B","text":"LH-5"},{"label":"C","text":"HD-7"},{"label":"D","text":"None of these"}],"answer":"A"},{"week":2,"num":15,"q":"What are the key characteristics of agility?","options":[{"label":"A","text":"Stability, Rigidity, and Standardization"},{"label":"B","text":"Flexibility, Adaptation, and Self-configuration"},{"label":"C","text":"Planning, Controlling, and Monitoring"},{"label":"D","text":"Automation, Documentation, and Testing"}],"answer":"B"},{"week":3,"num":1,"q":"What does \"reactive computation\" in CPS signify?","options":[{"label":"A","text":"Systems with zero response time"},{"label":"B","text":"Interaction with the environment in an ongoing manner"},{"label":"C","text":"Predefined computation processes"},{"label":"D","text":"Complete isolation from physical feedback"}],"answer":"B"},{"week":3,"num":2,"q":"Fill in the blanks. In healthcare applications, CPS is used for __________.","options":[{"label":"A","text":"Image-guided surgery and therapy"},{"label":"B","text":"Manual monitoring of vitals"},{"label":"C","text":"Static hospital management systems"},{"label":"D","text":"Front desk management"}],"answer":"A"},{"week":3,"num":3,"q":"Which level in the \"5C Architecture\" ensures the gathering of precise status information of machines?","options":[{"label":"A","text":"Conversion"},{"label":"B","text":"Cognition"},{"label":"C","text":"Cyber"},{"label":"D","text":"Configuration"}],"answer":"C"},{"week":3,"num":4,"q":"Fill in the blanks. Intelligent sensors are capable of __________________.","options":[{"label":"A","text":"Only sensing data"},{"label":"B","text":"Processing sensed data and managing external sensors/devices"},{"label":"C","text":"Limited communication"},{"label":"D","text":"Basic analog-to-digital conversion"}],"answer":"B"},{"week":3,"num":5,"q":"How many steps are there in the PLM solution approach in Industry 4.0?","options":[{"label":"A","text":"10"},{"lab function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2800);}
function openModal(title,body,actions){$('mTitle').textContent=title;const mb=$('mBody');mb.innerHTML='';mb.appendChild(body);const ma=$('mActions');ma.innerHTML='';
  actions.forEach(a=>{const b=el('button','btn '+(a.cls||'secondary'),a.text);b.onclick=()=>{closeModal();if(a.fn)a.fn();};ma.appendChild(b);});$('modal').hidden=false;modalOpen=true;}
function closeModal(){$('modal').hidden=true;modalOpen=false;}
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal();});

/* ---------- setup screen ---------- */
function readCfg(){const weeks=[...document.querySelectorAll('#weekChips input:checked')].map(i=>+i.value);
  return{weeks,source:$('selSource').value,count:+$('selCount').value,limit:+$('selLimit').value,mode:document.querySelector('input[name=mode]:checked').value,shuffleQ:$('cbShufQ').checked,shuffleO:$('cbShufO').checked};}
function pickPool(cfg){const st=store.get(K_STATS,{});
  return SOURCE.filter(q=>cfg.weeks.includes(q.week)&&(cfg.source!=='mistakes'||(st[q.id]&&st[q.id].last===0))).map(q=>q.id);}
function mistakeCount(){const st=store.get(K_STATS,{});return SOURCE.filter(q=>st[q.id]&&st[q.id].last===0).length;}
function updatePool(){const cfg=readCfg();const n=pickPool(cfg).length;const eff=cfg.count>0?Math.min(cfg.count,n):n;
  $('poolInfo').textContent=n?('This quiz: '+eff+' question'+(eff===1?'':'s')+(cfg.count>0&&n>cfg.count?' (random '+eff+' of '+n+')':'')):'No questions match this selection.';
  $('startBtn').disabled=!n;store.set(K_SETUP,cfg);}
function initSetup(){const wc=$('weekChips');
  WEEKS.forEach(w=>{const l=el('label','wk');const i=document.createElement('input');i.type='checkbox';i.value=w;i.checked=true;i.onchange=updatePool;l.append(i,document.createTextNode('Week '+w));wc.appendChild(l);});
  const sv=store.get(K_SETUP,null);
  if(sv){document.querySelectorAll('#weekChips input').forEach(i=>i.checked=(sv.weeks||WEEKS).includes(+i.value));
    $('selCount').value=String(sv.count||0);$('selLimit').value=String(sv.limit||0);$('cbShufQ').checked=sv.shuffleQ!==false;$('cbShufO').checked=sv.shuffleO!==false;
    const r=document.querySelector('input[name=mode][value='+(sv.mode==='practice'?'practice':'exam')+']');if(r)r.checked=true;}
  ['selSource','selCount','selLimit','cbShufQ','cbShufO'].forEach(id=>$(id).onchange=updatePool);
  document.querySelectorAll('input[name=mode]').forEach(r=>r.onchange=updatePool);
  $('wkAll').onclick=()=>{document.querySelectorAll('#weekChips input').forEach(i=>i.checked=true);updatePool();};
  $('wkNone').onclick=()=>{document.querySelectorAll('#weekChips input').forEach(i=>i.checked=false);updatePool();};
  $('startBtn').onclick=()=>{const cfg=readCfg();startAttempt(cfg,null);};
  refreshSetup();}
function refreshSetup(){const mc=mistakeCount();$('optMistakes').textContent='My previous mistakes ('+mc+')';
  if(mc===0&&$('selSource').value==='mistakes')$('selSource').value='all';
  renderAudit();renderHistory();renderResume();updatePool();}
function renderAudit(){const c=$('auditCard');c.innerHTML='';c.appendChild(el('h3',null,'Answer-key check'));
  if(AUDIT.problems.length){const p=el('div','warnline','⚠ '+AUDIT.problems.length+' problem(s) found in the question data:');c.appendChild(p);const ul=el('ul');AUDIT.problems.forEach(x=>ul.appendChild(el('li',null,x)));c.appendChild(ul);}
  else c.appendChild(el('div','okline','✔ All '+AUDIT.total+' questions checked: every answer key points to a valid option, no duplicate questions or options.'+(AUDIT.tf?' ('+AUDIT.tf+' True/False questions with 2 options.)':'')));
  c.appendChild(el('div','small','This check runs every time the page loads. After you submit, each answer is also graded two independent ways and compared.'));}
function renderHistory(){const c=$('histCard');c.innerHTML='';c.appendChild(el('h3',null,'Your history'));const h=store.get(K_HIST,[]);
  if(!h.length){c.appendChild(el('div','small','No completed quizzes yet. Your scores and weak questions will appear here.'));return;}
  const t=el('table');t.innerHTML='<tr><th>Date</th><th>Score</th><th>Mode</th><th>Time</th></tr>';
  h.slice(-8).reverse().forEach(r=>{const tr=el('tr');[new Date(r.t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}),r.score+' / '+r.total+' ('+r.pct.toFixed(1)+'%)',r.mode,fmt(r.ms)].forEach(x=>tr.appendChild(el('td',null,x)));t.appendChild(tr);});
  c.appendChild(t);const b=el('button','btn secondary mini','Clear history & mistake tracking');b.style.marginTop='10px';b.onclick=()=>{if(confirm('Clear all saved history and mistake tracking?')){store.del(K_HIST);store.del(K_STATS);refreshSetup();}};c.appendChild(b);}
function renderResume(){const box=$('resumeBox');box.innerHTML='';const sv=store.get(K_ATT,null);
  if(!sv||!Array.isArray(sv.items)||!sv.items.length||!sv.items.every(it=>BYID.has(it.id)))return;
  const card=el('div','card resume');const ans=Object.keys(sv.answers||{}).length;
  if(sv.submitted){const g=grade(sv);card.appendChild(el('h2',null,'Last quiz: '+g.score+' / '+g.total+' ('+(g.total?g.score/g.total*100:0).toFixed(1)+'%)'));}
  else card.appendChild(el('h2',null,'Quiz in progress — '+ans+' / '+sv.items.length+' answered'));
  const r=el('div','rowbtns');const b1=el('button','btn primary',sv.submitted?'View results & review':'Resume quiz');b1.onclick=()=>{A=sv;A.t0=Date.now();openQuiz();};
  const b2=el('button','btn secondary','Discard');b2.onclick=()=>{if(confirm('Discard this saved quiz?')){store.del(K_ATT);refreshSetup();}};r.append(b1,b2);card.appendChild(r);box.appendChild(card);}

/* ---------- attempt lifecycle ---------- */
function startAttempt(cfg,idsOverride){let ids=(idsOverride||pickPool(cfg)).slice();
  if(!ids.length){toast('No questions match your selection.');return;}
  if(cfg.shuffleQ)shuffle(ids);
  if(!idsOverride&&cfg.count>0&&cfg.count<ids.length)ids=ids.slice(0,cfg.count);
  const items=ids.map(id=>{const q=BYID.get(id);const order=q.options.map(o=>o.label);if(cfg.shuffleO&&order.length>2)shuffle(order);return{id,order};});
  A={v:2,mode:cfg.mode,limit:cfg.limit||0,cfg,items,answers:{},flags:{},submitted:false,base:0,t0:Date.now(),started:Date.now()};
  persist();openQuiz();}
function persist(){if(!A)return;A.base=elapsed();A.t0=Date.now();if(A.submitted)A.t0=Date.now();store.set(K_ATT,A);}
function elapsed(){return A.submitted?A.base:A.base+(Date.now()-A.t0);}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,'0');return(h?h+':':'')+p(m)+':'+p(x);}
function startTimer(){stopTimer();tick();timer=setInterval(tick,1000);}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function tick(){if(!A||A.submitted)return;const e=elapsed();const t=$('timer');
  if(A.limit>0){const rem=A.limit*60000-e;t.textContent='⏱ '+fmt(rem)+' left';t.classList.toggle('warn',rem<5*60000);if(rem<=0){stopTimer();toast('Time is up — submitting your quiz.');finalize();return;}}
  else{t.textContent='⏱ '+fmt(e);t.classList.remove('warn');}
  if(Math.floor(e/1000)%10===0)persist();}
function openQuiz(){showMissing=false;$('setupView').hidden=true;$('quizView').hidden=false;renderQuiz();
  if(A.submitted){$('timer').textContent='⏱ '+fmt(A.base);showResult(false);}else{$('result').hidden=true;startTimer();}
  updateStatus();window.scrollTo(0,0);}
function toMenu(){if(A&&!A.submitted)persist();stopTimer();closeModal();$('quizView').hidden=true;$('setupView').hidden=false;A=null;cards=[];refreshSetup();window.scrollTo(0,0);}

/* ---------- rendering ---------- */
function renderQuiz(){const root=$('quiz');root.innerHTML='';root.className='';cards=[];
  A.items.forEach((it,i)=>{const q=BYID.get(it.id);const card=el('article','qcard');card.id='q'+i;
    const head=el('div','qhead');head.appendChild(el('div','qnum',String(i+1).padStart(3,'0')));
    const qw=el('div');qw.style.flex='1';qw.appendChild(el('div','question',q.q));
    if(q.image){const img=document.createElement('img');img.src=q.image;img.alt='Diagram for this question';img.style.cssText='display:block;width:100%;max-width:620px;height:auto;margin:0 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff';qw.appendChild(img);}
    head.append(qw,el('div','week','Week '+q.week));card.appendChild(head);
    const opts=el('div','options');const map={};
    it.order.forEach((lab,j)=>{const o=q.options.find(x=>x.label===lab);const row=el('label','opt');const inp=document.createElement('input');inp.type='radio';inp.name='r'+i;inp.value=lab;inp.setAttribute('aria-label',LETTERS[j]+'. '+o.text);
      inp.onchange=()=>selectAnswer(i,lab);row.append(inp,el('span','letter',LETTERS[j]+'.'),el('span','opttext',o.text));opts.appendChild(row);map[lab]={row,input:inp};});
    card.appendChild(opts);const fb=el('div','feedback');card.appendChild(fb);
    const foot=el('div','qfoot');const flag=el('button','linkbtn','⚐ Flag for review');flag.onclick=()=>{if(A.submitted)return;if(A.flags[it.id])delete A.flags[it.id];else A.flags[it.id]=1;persist();paintCard(i);updateStatus();};
    const clr=el('button','linkbtn','Clear answer');clr.onclick=()=>{if(A.submitted||A.mode==='practice')return;delete A.answers[it.id];persist();paintCard(i);updateStatus();};
    foot.append(flag,clr);card.appendChild(foot);root.appendChild(card);cards.push({card,map,fb,flag,clr});});
  A.items.forEach((_,i)=>paintCard(i));$('endbar').hidden=A.submitted;}
function paintCard(i){const c=cards[i],it=A.items[i],q=BYID.get(it.id),chosen=A.answers[it.id]||null;
  const reveal=A.submitted||(A.mode==='practice'&&!!chosen);
  it.order.forEach(lab=>{const o=c.map[lab];o.input.checked=chosen===lab;o.input.disabled=reveal;let cls='opt';
    if(reveal){cls+=' locked';if(lab===q.answer)cls+=' correct';else if(lab===chosen)cls+=' wrong';}else if(chosen===lab)cls+=' selected';o.row.className=cls;});
  if(reveal){const ok=chosen===q.answer;const ct=q.options.find(o=>o.label===q.answer).text;c.fb.className='feedback '+(!chosen?'skip':ok?'good':'bad');
    c.fb.textContent=(!chosen?'Not answered':ok?'Correct':'Incorrect')+' — Correct answer: '+LETTERS[it.order.indexOf(q.answer)]+'. '+ct+'  ·  Original: Week '+q.week+', Question '+q.num;}
  else{c.fb.className='feedback';c.fb.textContent='';}
  if(A.submitted)c.card.dataset.res=!chosen?'skipped':(chosen===q.answer?'correct':'wrong');else delete c.card.dataset.res;
  c.card.classList.toggle('flagged',!!A.flags[it.id]);c.card.classList.toggle('missing',showMissing&&!A.submitted&&!chosen);
  c.flag.className='linkbtn'+(A.flags[it.id]?' on':'');c.flag.textContent=A.flags[it.id]?'⚑ Flagged':'⚐ Flag for review';c.flag.disabled=A.submitted;
  c.clr.hidden=!(chosen&&!reveal);}
function selectAnswer(i,lab){if(A.submitted)return;const id=A.items[i].id;if(A.mode==='practice'&&A.answers[id])return;
  A.answers[id]=lab;persist();paintCard(i);updateStatus();}
function unanswered(){return A.items.map((it,i)=>A.answers[it.id]?-1:i).filter(i=>i>=0);}
function updateStatus(){if(!A)return;const n=A.items.length,done=Object.keys(A.answers).length,left=n-done,fl=Object.keys(A.flags).length;
  $('counter').textContent=A.submitted?('Reviewing '+n+' questions'):('Answered '+done+' / '+n+(fl?' · ⚑ '+fl:''));
  $('progress').style.width=(done/n*100)+'%';
  const bn=$('btnNext');bn.textContent='Find unanswered'+(left?' ('+left+')':'');bn.disabled=A.submitted||left===0;
  $('btnSubmit').disabled=A.submitted;$('btnSubmit2').textContent='Submit quiz'+(left?' ('+left+' unanswered)':'');
  $('btnSubmit').textContent=A.submitted?'Submitted':'Submit';}
function goTo(i){const c=cards[i];if(!c)return;c.card.scrollIntoView({behavior:'smooth',block:'center'});c.card.classList.remove('flash');void c.card.offsetWidth;c.card.classList.add('flash');}
function currentIndex(){for(let i=0;i<cards.length;i++){if(cards[i].card.getBoundingClientRect().bottom>110)return i;}return 0;}
function findNext(){if(!A||A.submitted)return;const un=unanswered();if(!un.length){toast('Every question is answered ✔');return;}
  showMissing=true;A.items.forEach((_,i)=>paintCard(i));const cur=currentIndex();const nxt=un.find(i=>i>cur)??un[0];goTo(nxt);toast('Question '+(nxt+1)+' is unanswered ('+un.length+' left in total)');}

/* ---------- map ---------- */
function openMap(){if(!A)return;const body=el('div');const lg=el('div','legend');
  lg.innerHTML=A.submitted?'<span><i style="background:var(--green-bg)"></i>Correct</span><span><i style="background:var(--red-bg)"></i>Wrong</span><span><i style="background:var(--amber-bg)"></i>Skipped</span>':'<span><i style="background:var(--accent)"></i>Answered</span><span><i style="background:var(--amber-bg)"></i>Unanswered</span><span>⚑ Flagged</span>';
  body.appendChild(lg);const g=el('div','map');
  A.items.forEach((it,i)=>{const q=BYID.get(it.id),ch=A.answers[it.id];let cls='mchip';
    if(A.submitted)cls+=!ch?' sk':(ch===q.answer?' ok':' no');else cls+=ch?' a':' u';if(A.flags[it.id])cls+=' f';
    const b=el('button',cls,String(i+1));b.onclick=()=>{closeModal();goTo(i);};g.appendChild(b);});
  body.appendChild(g);openModal('Question map',body,[{text:'Close'}]);}

/* ---------- submit ---------- */
function trySubmit(){if(!A||A.submitted)return;const un=unanswered(),fl=Object.keys(A.flags).length;const body=el('div');
  if(un.length){showMissing=true;A.items.forEach((_,i)=>paintCard(i));
    body.appendChild(el('p',null,'You have '+un.length+' unanswered question'+(un.length>1?'s':'')+'. Tap a number to jump to it:'));
    const g=el('div','map');un.forEach(i=>{const b=el('button','mchip u',String(i+1));b.onclick=()=>{closeModal();goTo(i);};g.appendChild(b);});body.appendChild(g);
    body.appendChild(el('p','small','If you submit anyway, unanswered questions count as incorrect.'));
    openModal('Unanswered questions',body,[{text:'Go to first unanswered',cls:'primary',fn:()=>goTo(un[0])},{text:'Submit anyway',cls:'danger',fn:finalize}]);}
  else{body.appendChild(el('p',null,'All '+A.items.length+' questions are answered.'+(fl?' You still have '+fl+' flagged for review.':'')+' Submit now?'));
    const acts=[];if(fl)acts.push({text:'Review flagged',fn:()=>{const f=A.items.findIndex(it=>A.flags[it.id]);if(f>=0)goTo(f);}});acts.push({text:'Keep checking'});acts.push({text:'Submit',cls:'primary',fn:finalize});
    openModal('Submit quiz?',body,acts);}}

/* ---------- grading (two independent methods) ---------- */
function grade(att){const rows=att.items.map((it,i)=>{const q=BYID.get(it.id);const chosen=att.answers[it.id]||null;
    const correctOpt=q.options.find(o=>o.label===q.answer);const chosenOpt=chosen?q.options.find(o=>o.label===chosen):null;
    const m1=!!chosen&&chosen===q.answer;                       // method 1: compare option letters
    const m2=!!chosenOpt&&chosenOpt.text===correctOpt.text;     // method 2: compare option text
    return{i,id:it.id,week:q.week,num:q.num,q:q.q,chosen,skipped:!chosen,ok:m1,agree:m1===m2,valid:!chosen||it.order.includes(chosen),correctText:correctOpt.text,chosenText:chosenOpt?chosenOpt.text:null};});
  const byWeek={};rows.forEach(r=>{const w=byWeek[r.week]||(byWeek[r.week]={ok:0,total:0,skipped:0});w.total++;if(r.ok)w.ok++;if(r.skipped)w.skipped++;});
  return{rows,total:rows.length,score:rows.filter(r=>r.ok).length,skipped:rows.filter(r=>r.skipped).length,disagree:rows.filter(r=>!r.agree||!r.valid).length,byWeek};}
function domCheck(){let bad=0;cards.forEach((c,i)=>{const id=A.items[i].id;const chk=c.card.querySelector('input:checked');const shown=chk?chk.value:null;if(shown!==(A.answers[id]||null))bad++;});return bad;}

function finalize(){if(!A||A.submitted)return;stopTimer();closeModal();showMissing=false;
  const dom=domCheck();A.base=elapsed();A.submitted=true;A.domMismatch=dom;persist();
  const g=grade(A);
  const st=store.get(K_STATS,{});g.rows.forEach(r=>{const s=st[r.id]||(st[r.id]={n:0,w:0,last:null});s.n++;if(!r.ok)s.w++;s.last=r.ok?1:0;});store.set(K_STATS,st);
  const h=store.get(K_HIST,[]);h.push({t:Date.now(),score:g.score,total:g.total,pct:g.total?g.score/g.total*100:0,mode:A.mode,ms:A.base});store.set(K_HIST,h.slice(-50));
  A.items.forEach((_,i)=>paintCard(i));$('endbar').hidden=true;$('timer').textContent='⏱ '+fmt(A.base);updateStatus();showResult(true);}

function showResult(scroll){const g=grade(A);const r=$('result');r.hidden=false;const pct=g.total?g.score/g.total*100:0;const wrong=g.total-g.score-g.skipped;
  const dom=A.domMismatch||0;const ok=g.disagree===0&&dom===0;
  let wk='';Object.keys(g.byWeek).map(Number).sort((a,b)=>a-b).forEach(w=>{const x=g.byWeek[w];const p=x.total?x.ok/x.total*100:0;wk+='<tr><td>Week '+w+'</td><td>'+x.ok+' / '+x.total+'</td><td>'+p.toFixed(0)+'%</td><td><div class="wkbar"><span style="width:'+p+'%"></span></div></td></tr>';});
  let weak='';const ws=Object.keys(g.byWeek).map(Number).filter(w=>g.byWeek[w].ok<g.byWeek[w].total).sort((a,b)=>g.byWeek[a].ok/g.byWeek[a].total-g.byWeek[b].ok/g.byWeek[b].total);
  if(ws.length&&Object.keys(g.byWeek).length>1)weak='<p class="small">Focus next on: '+ws.slice(0,3).map(w=>'Week '+w+' ('+(g.byWeek[w].ok/g.byWeek[w].total*100).toFixed(0)+'%)').join(', ')+'</p>';
  r.innerHTML='<h2>Quiz submitted</h2><div class="score">'+g.score+' / '+g.total+'</div><div><strong>'+pct.toFixed(2)+'%</strong> correct</div>'+
   '<div class="stats"><span>✔ Correct <b>'+g.score+'</b></span><span>✖ Wrong <b>'+wrong+'</b></span><span>— Skipped <b>'+g.skipped+'</b></span><span>⏱ Time <b>'+fmt(A.base)+'</b></span></div>'+
   '<div class="verify'+(ok?'':' bad')+'">'+(ok?'✔ Grading verified: all '+g.total+' answers were checked two independent ways (by option letter and by option text) and the screen selections matched the saved answers every time.':'⚠ Grading mismatch detected in '+(g.disagree+dom)+' question(s). Please screenshot this and tell me — do not trust this score.')+'</div>'+
   '<table><tr><th>Week</th><th>Score</th><th>%</th><th></th></tr>'+wk+'</table>'+weak+
   '<div class="filters" id="filters"></div><div class="rowbtns" id="resBtns"></div>';
  const fl=$('filters');[['all','All ('+g.total+')'],['wrong','Wrong ('+wrong+')'],['skipped','Skipped ('+g.skipped+')'],['correct','Correct ('+g.score+')'],['flag','Flagged ('+Object.keys(A.flags).length+')']].forEach(([k,t])=>{const b=el('button','btn secondary'+(k==='all'?' on':''),t);b.onclick=()=>{$('quiz').className=k==='all'?'':'f-'+k;fl.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');};fl.appendChild(b);});
  const rb=$('resBtns');const bad=g.rows.filter(x=>!x.ok);
  const retry=el('button','btn primary','Retry wrong + skipped ('+bad.length+')');retry.disabled=!bad.length;retry.onclick=()=>startAttempt(Object.assign({},A.cfg,{mode:A.mode,limit:0}),bad.map(x=>x.id));
  const dl=el('button','btn secondary','Download report (.txt)');dl.onclick=()=>downloadReport(g);
  const mp=el('button','btn secondary','🗺 Map');mp.onclick=openMap;
  const nw=el('button','btn secondary','New quiz');nw.onclick=()=>{store.del(K_ATT);toMenu();};rb.append(retry,dl,mp,nw);
  if(scroll)r.scrollIntoView({behavior:'smooth',block:'start'});}
function downloadReport(g){const L=[];L.push('NPTEL IIoT Quiz Report — '+new Date().toLocaleString());L.push('Score: '+g.score+' / '+g.total+' ('+(g.total?g.score/g.total*100:0).toFixed(2)+'%)   Time: '+fmt(A.base)+'   Mode: '+A.mode);L.push('');
  Object.keys(g.byWeek).map(Number).sort((a,b)=>a-b).forEach(w=>L.push('Week '+w+': '+g.byWeek[w].ok+' / '+g.byWeek[w].total));L.push('');L.push('QUESTIONS TO REVISE (wrong or skipped)');L.push('======================================');
  g.rows.filter(x=>!x.ok).forEach(x=>{L.push('');L.push('Week '+x.week+', Question '+x.num+(x.skipped?'  [SKIPPED]':''));L.push(x.q);L.push('  Your answer   : '+(x.chosenText==null?'(none)':x.chosenText));L.push('  Correct answer: '+x.correctText);});
  const blob=new Blob([L.join('\n')],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nptel-iiot-report.txt';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ---------- wiring ---------- */
$('btnSubmit').onclick=trySubmit;$('btnSubmit2').onclick=trySubmit;$('btnMap').onclick=openMap;$('btnNext').onclick=findNext;$('btnMenu').onclick=toMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalOpen){closeModal();return;}if(e.ctrlKey||e.metaKey||e.altKey||modalOpen||$('quizView').hidden||!A)return;
  if(e.key==='n'||e.key==='N')findNext();else if(e.key==='m'||e.key==='M')openMap();});
window.addEventListener('pagehide',()=>{if(A&&!A.submitted)persist();});
window.__quiz={get A(){return A;},SOURCE,BYID,grade,AUDIT};
initSetup();
})();
</script></body></html>
